[project]
name = "sahelcast"
version = "0.1.0"
description = "Calibrated, decision-focused solar PV forecasting and battery dispatch for Algeria on a DuckLake lakehouse."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.5.3",            # 1.5.3+ fixes DuckLake table renames used by dbt
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pvlib>=0.13",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "cvxpy>=1.5",
    "hierarchicalforecast>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "plotly>=5.24",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
    "dagster>=1.10",
    "dagster-webserver>=1.10",
]

[project.optional-dependencies]
# Chronos-2 pulls in PyTorch. Kept optional so CI stays small and fast.
chronos = ["chronos-forecasting>=2.3"]
# Decision-focused learning example (Phase 5, advanced).
dfl = ["cvxpylayers>=1.0", "torch>=2.4"]
# Optional streaming upgrade (Phase 1, step 1.8).
stream = ["confluent-kafka>=2.5"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
sahelcast = "sahelcast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahelcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that run dbt and the whole pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.dagster]
module_name = "sahelcast.orchestration.definitions"
